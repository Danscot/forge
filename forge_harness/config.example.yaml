# FORGE configuration template. Copy to <project>/.harness/config.yaml via `forge init`.
# Provider/model settings are configured below; role-aware effort defaults are applied by the runtime. Edit effort_policy to customize them.
version: 1

project:
  root: "."
  input_dir: "input"
  mockups_dir: "input/mockups"
  assets_dir: "input/assets"
  harness_dir: ".harness"
  navigation_url: "http://127.0.0.1:8081/"
  expo_command: ["npx", "expo", "start", "--web", "--port", "8081", "--non-interactive"]
  typecheck_command: ["npx", "tsc", "--noEmit"]
  functional_check_command: []
  server_start_timeout_s: 90
  render_timeout_ms: 45000
  screenshot_full_page: false
  browser_viewport:
    width: 390
    height: 844
    device_scale_factor: 2
  max_mockup_images: 8
  max_image_bytes: 7000000

execution:
  default_mode: "interactive" # autonomous | approval | interactive
  max_task_retries: 3
  approve_each_patch: true
  approve_high_risk_in_autonomous: false
  allow_dependency_install: false

llm:
  default_provider: "nvidia"
  streaming: true
  display_reasoning_stream: true
  request_timeout_s: 120
  connect_timeout_s: 20
  max_retries: 3
  initial_backoff_s: 1.0
  max_backoff_s: 25.0
  backoff_multiplier: 2.0
  jitter_fraction: 0.25
  structured_repair_attempts: 1
  # Patch generation is already constrained by the approved plan. Disable model
  # thinking for that stage by default to avoid spending minutes on unneeded reasoning.
  # Set thinking_enabled: true if your selected model needs reasoning to author patches.
  # Role-aware effort policy is enabled by default, including for projects initialized
  # with an older config. It overrides old per-agent thinking budgets so every agent
  # does not spend the same amount of reasoning. Set enabled: false to honor only the
  # legacy llm.agents.* values below. Customize role defaults under agents; per-call
  # adaptation and patch_generation controls still apply separately.
  # Call-specific adaptation (small/large planner input, multi-mockup vision, repeated
  # validation failures) remains active because it is separate from these base profiles.
  effort_policy:
    enabled: true
    agents:
      planner:
        thinking_enabled: true
        thinking_budget: 2048
        max_output_tokens: 6144
      vision:
        thinking_enabled: true
        thinking_budget: 768
        max_output_tokens: 3500
      coder:
        thinking_enabled: false
        max_output_tokens: 12000
      critic:
        thinking_enabled: false
        max_output_tokens: 3200
      diagnostic:
        thinking_enabled: true
        thinking_budget: 1024
        max_output_tokens: 4000
    # Small projects use a cheaper planner pass; large specs / many mockups escalate.
    planner_thresholds:
      simple_context_chars: 12000
      complex_context_chars: 30000
    # Diagnostic effort only increases after repeated failed repair attempts.
    diagnostic_escalation:
      after_task_retries: 2
      thinking_budget: 2048
      max_output_tokens: 5000
    # Separate planning (small operation plan) from patch authoring (actual code).
    coder_plan:
      thinking_enabled: false
      max_output_tokens: 3500
  patch_generation:
    thinking_enabled: false
    # Optional hard cap; omitted means use the coder agent's max_output_tokens.
    # max_output_tokens: 8192
    structured_repair_attempts: 1
  max_images_per_request: 6
  max_total_image_bytes: 14000000
  log_payloads: false
  log_payload_char_limit: 5000
  # Use full model references here, e.g. ["gemini:gemini-2.5-flash"], rather than bare provider names.
  fallback_providers: []
  # Provider adapter maps canonical settings into provider-specific request fields.
  # Dotted keys are supported, e.g. chat_template_kwargs.enable_thinking.
  providers:
    nvidia:
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key_env: "NVIDIA_API_KEY"
      extra_headers: {}
      static_request_params:
        stream_options:
          include_usage: true
      parameter_map:
        max_output_tokens: "max_tokens"
        thinking_enabled: "chat_template_kwargs.enable_thinking"
        thinking_budget: "chat_template_kwargs.thinking_budget"
      reasoning_fields: ["reasoning_content", "reasoning", "thinking"]
    gemini:
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "GOOGLE_API_KEY"
      extra_headers: {}
      static_request_params: {}
      parameter_map:
        max_output_tokens: "max_tokens"
      reasoning_fields: ["reasoning_content", "reasoning", "thinking"]
    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      extra_headers: {}
      static_request_params:
        stream_options:
          include_usage: true
      parameter_map:
        max_output_tokens: "max_tokens"
      reasoning_fields: ["reasoning_content", "reasoning", "thinking"]
    openai:
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"
      extra_headers: {}
      static_request_params:
        stream_options:
          include_usage: true
      parameter_map:
        max_output_tokens: "max_completion_tokens"
      reasoning_fields: ["reasoning_content", "reasoning", "thinking"]
    z_ai:
      base_url: "https://api.z.ai/api/paas/v4/"
      api_key_env: "Z_API_KEY"
      extra_headers: {}
      static_request_params: {}
      parameter_map:
        max_output_tokens: "max_tokens"
      reasoning_fields: ["reasoning_content", "reasoning", "thinking"]

  # Each agent's provider/model settings remain independent. The enabled effort_policy
  # above supplies role-aware thinking/token defaults; these legacy fields are honored
  # when effort_policy.enabled is false, or can be overridden role-by-role above.
  agents:
    planner:
      model: "nvidia:nvidia/nemotron-3.5-super-vl-120b-a12b"
      temperature: 0.25
      top_p: 0.9
      max_output_tokens: 6144
      context_window_tokens: null # set to the model's documented context window if known
      streaming: true
      thinking_enabled: true
      thinking_budget: 2048
      request_params: {}
      fallback_models: []
    vision:
      model: "nvidia:nvidia/nemotron-3.5-super-vl-120b-a12b"
      temperature: 0.2
      top_p: 0.9
      max_output_tokens: 3500
      context_window_tokens: null # set to the model's documented context window if known
      streaming: true
      thinking_enabled: true
      thinking_budget: 768
      request_params: {}
      fallback_models: []
    coder:
      model: "nvidia:nvidia/nemotron-3.5-super-vl-120b-a12b"
      temperature: 0.2
      top_p: 0.9
      max_output_tokens: 12000
      context_window_tokens: null # set to the model's documented context window if known
      streaming: true
      thinking_enabled: false
      request_params: {}
      fallback_models: []
    critic:
      model: "nvidia:nvidia/nemotron-3.5-super-vl-120b-a12b"
      temperature: 0.15
      top_p: 0.9
      max_output_tokens: 3200
      context_window_tokens: null # set to the model's documented context window if known
      streaming: true
      thinking_enabled: false
      request_params: {}
      fallback_models: []
    diagnostic:
      model: "nvidia:nvidia/nemotron-3.5-super-vl-120b-a12b"
      temperature: 0.2
      top_p: 0.9
      max_output_tokens: 4000
      context_window_tokens: null # set to the model's documented context window if known
      streaming: true
      thinking_enabled: true
      thinking_budget: 1024
      request_params: {}
      fallback_models: []

logging:
  level: "INFO"
  console_level: "WARNING"
  capture_payloads: false
  max_event_file_mb: 30
  backups: 5
  redact_patterns:
    - 'sk-[A-Za-z0-9_-]{12,}'
    - 'nvapi-[A-Za-z0-9_-]{12,}'
    - '(?i)(api[_-]?key\s*[:=]\s*)[^\s,]+'

validation:
  functional_weight: 0.6
  visual_weight: 0.4
  require_typecheck: true
  require_runtime_render: true
  require_functional_checks: true
  require_visual_critic_when_mockup_exists: true
  fail_on_page_errors: true
  fail_on_console_errors: false
  minimum_quality_score: 75

security:
  permitted_shell_executables: ["npx", "npm", "node", "python", "python3", "pytest", "git"]
  blocked_commands: ["rm -rf /", "sudo", "mkfs", "shutdown", "reboot"]
  excluded_context_names: [".env", ".env.local", ".env.production", "id_rsa", "id_ed25519", "credentials.json"]
  max_file_bytes: 2000000

costs:
  # Add pricing per million tokens by provider/model to enable estimates. Unknown prices show as n/a.
  models: {}
